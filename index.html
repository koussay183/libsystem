<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#236462" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Open the sockets to Firebase while the app bundle is still downloading.
      DNS + TLS to a Google endpoint costs a few hundred milliseconds on a shop
      connection, and doing it in parallel takes that off the first paint.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <title>Librairie — Gestion</title>

    <!--
      A plain white screen until React boots reads as "it is broken" to someone
      who is not used to computers. This shows the shop's colours and a moving
      spinner from the very first frame; React clears it when it mounts.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f7fafa;
        color: #236462;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
      }
      #boot .ring {
        width: 3rem;
        height: 3rem;
        border: 4px solid #d9efec;
        border-top-color: #287a76;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .label {
        font-size: 1.15rem;
        font-weight: 600;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="ring"></div>
        <div class="label">Librairie</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
